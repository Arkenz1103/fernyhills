  - main [ref=f17e42]:
    - generic [ref=f17e45]:
      - heading "We Ensure Lasting Rehabilitation" [level=2] [ref=f17e46]
      - generic [ref=f17e47]: Women's Health Physiotherapist for Ferny Grove & Samford
    - generic [ref=f17e51]:
      - heading "We Believe in Customised Care" [level=2] [ref=f17e52]
      - generic [ref=f17e53]: At Ferny Hills Physiotherapy Centre, we don't see you as just another patient. We understand that your body and your circumstances are highly unique, which is why we provide distinctive treatment to each client that will most benefit the individual. We want your treatment experience to be positive and effective.
      - link "Let's talk" [ref=f17e55] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f17e61]:
      - generic [ref=f17e62]:
        - heading "How We Can Help" [level=2] [ref=f17e63]
        - generic [ref=f17e64]: "We treat for the following conditions:"
      - generic [ref=f17e66]:
        - heading "Spinal Injuries" [level=3] [ref=f17e71]
        - heading "Neck and back pain" [level=3] [ref=f17e76]
        - heading "Arthritis" [level=3] [ref=f17e81]
      - generic [ref=f17e83]:
        - heading "Upper and lower limb injuries and conditions" [level=3] [ref=f17e88]
        - heading "Sporting injuries" [level=3] [ref=f17e93]
        - heading "Work injuries" [level=3] [ref=f17e98]
      - generic [ref=f17e100]:
        - heading "Whiplash" [level=3] [ref=f17e105]
        - heading "Chronic pain" [level=3] [ref=f17e110]
        - heading "Post-operative rehabilitation and more" [level=3] [ref=f17e115]
    - generic [ref=f17e121]:
      - heading "Our Personalised Treatment approach" [level=2] [ref=f17e122]
      - generic [ref=f17e123]: Our treatment plan for you begins with a comprehensive assessment and physical exam to diagnose your condition. We then communicate with you and other health professionals to collaborate on a treatment and recovery plan to get you back on your feet. When we have determined your health goal, we will begin treatment which involves hands-on mobilisation and soft tissue techniques. Once your initial complaint is treated, we will teach you to manage your pain and aid your recovery.All of our treatment techniques are based on scientific research and clinical experience. We are always adapting to new treatment methods and advances in technology so you receive the most up-to-date care.
      - link "Let's talk" [ref=f17e125] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f17e129]:
      - heading "We use state-of-the-art equipment for your care" [level=2] [ref=f17e130]
      - link "Contact us" [ref=f17e132] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f17e137]:
      - heading "Specialised equipment" [level=2] [ref=f17e138]
      - generic [ref=f17e139]: At Ferny Hills Physiotherapy, we use the best possible diagnostic and treatment equipment. This includes our Vibro Trainer for advanced muscle training and our Gaitscan™ biomechanical footprint scanner to identify abnormalities and prescribe custom orthotics. We also supply equipment that aids in rehabilitation and injury prevention such as supportive braces, therapeutic sandals and contoured pillows. Our staff is happy to help you obtain these materials to promote your speedy recovery.
      - link "Let's talk" [ref=f17e141] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f17e147]:
      - heading "Contact us today" [level=2] [ref=f17e148]
      - generic [ref=f17e149]: If you or someone you love is suffering from one of these debilitating ailments, stop by our clinic to find out how we can help.
      - button "Contact us" [ref=f17e151] [cursor=pointer]
