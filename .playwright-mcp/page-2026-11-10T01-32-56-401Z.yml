  - main [ref=f19e42]:
    - generic [ref=f19e45]:
      - heading "Our friendly staff is here for you" [level=2] [ref=f19e46]
      - generic [ref=f19e47]: Arthritis Treatment Available in Ferny Hills
    - generic [ref=f19e51]:
      - heading "Treatment to relieve your suffering" [level=2] [ref=f19e52]
      - generic [ref=f19e53]: Do you struggle to climb the stairs in your own home because your joints are screaming at you in protest? You aren’t alone – there are over 100 different kinds of arthritis, and it afflicts all age groups. Commonly, it is accompanied by pain, swelling, stiffness and decreased range of motion in the joints. Worst of all, it can cause permanent changes in your joints.We want to put an end to the pain causing the struggle in your every-day tasks.
      - link "Call today" [ref=f19e55] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f19e61]:
      - heading "We personalise treatments to suit your condition" [level=2] [ref=f19e62]
      - link "Contact us" [ref=f19e64] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f19e71]:
      - heading "How we can help" [level=2] [ref=f19e72]
      - generic [ref=f19e73]: A physiotherapist can get you moving again and that’s where we come in. We focus on strengthening your body to support your joints, getting them moving again and improving your overall ability to move. Our goal is to get you back to your daily activities without the suffering.In order to get you to this point, we come up with an individualised exercise plan for you to increase your strength and flexibility. Our hope is that you will come away from your visits with an increased knowledge of how to perform exercises independently so you can do them even when we aren’t around.In addition to these exercises, we may recommend using devices to assist you such as walkers, braces, orthotics, splints, and other such materials for easing your pain and making your day easier.
      - link "Let's talk" [ref=f19e75] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f19e80]:
      - heading "Live better" [level=2] [ref=f19e81]
      - generic [ref=f19e82]: Stop living with arthritis pain. Give us a call and let us help you enjoy life again.
      - link "Start healing today" [ref=f19e84] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
