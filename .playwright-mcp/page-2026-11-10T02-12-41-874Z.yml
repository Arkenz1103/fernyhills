    - generic [ref=f76e54]:
      - heading "What is Hydrotherapy?" [level=2] [ref=f76e55]
      - paragraph [ref=f76e57]: Hydrotherapy, also called “water cure,” is a low-impact way of treating pain and maintaining overall health in a natural, non-invasive way. It has shown to be one of the safest treatment methods for back pain and arthritis. We also use it in aiding muscle pain, nerve problems and relaxation.
      - link "More information" [ref=f76e58] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=f76e62]:
      - heading "We are always prompt, professional and friendly" [level=2] [ref=f76e64]
      - link "Contact us" [ref=f76e65] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=f76e73]:
      - heading "How it works" [level=2] [ref=f76e74]
      - generic [ref=f76e75]:
        - paragraph [ref=f76e76]: We use hydrotherapy to make your treatment relaxing and even enjoyable. The warm water is both soothing and pleasant while it increases circulation and causes the muscles to loosen, allowing for easier exercise.
        - paragraph [ref=f76e77]: Research suggests that hydrotherapy reduces injury by stimulating circulation and reducing swelling. It is also particularly useful in taking the weight off of a sore joint and providing resistance by utilising the physical properties of water.
        - paragraph [ref=f76e78]: Hydrotherapy is often confused with aqua aerobics, which is generally a strenuous exercise. Quite to the contrary, hydrotherapy focuses on slow and controlled movements that lead to relaxation. At the same time, pushing against the water helps improve muscle strength. Studies have shown that hydrotherapy can improve general fitness in those with arthritis.
      - link "Let's talk" [ref=f76e79] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=f76e84]:
      - generic [ref=f76e87]:
        - heading "Start Hydrotherapy" [level=2] [ref=f76e88]
        - paragraph [ref=f76e89]: Our hydrotherapy sessions can be tailored to your individual needs. You can begin slowly and gradually build up your strength and flexibility as you increase resistance. If you can’t swim, don’t worry. Our staff will always be present to assist you and help you exercise in the right depth for you. Call us today to see if hydrotherapy is right for you.
