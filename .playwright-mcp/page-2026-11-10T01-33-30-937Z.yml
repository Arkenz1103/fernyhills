  - main [ref=f22e42]:
    - generic [ref=f22e45]:
      - heading "Reduce sudden or long-lasting pain" [level=2] [ref=f22e46]
      - generic [ref=f22e47]: Hydrotherapy in Ferny Hills
    - generic [ref=f22e51]:
      - heading "What is Hydrotherapy?" [level=2] [ref=f22e52]
      - generic [ref=f22e53]: Hydrotherapy, also called “water cure,” is a low-impact way of treating pain and maintaining overall health in a natural, non-invasive way. It has shown to be one of the safest treatment methods for back pain and arthritis. We also use it in aiding muscle pain, nerve problems and relaxation.
      - link "More information" [ref=f22e55] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f22e61]:
      - heading "We are always prompt, professional and friendly" [level=2] [ref=f22e62]
      - link "Contact us" [ref=f22e64] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f22e71]:
      - heading "How it works" [level=2] [ref=f22e72]
      - generic [ref=f22e73]: We use hydrotherapy to make your treatment relaxing and even enjoyable. The warm water is both soothing and pleasant while it increases circulation and causes the muscles to loosen, allowing for easier exercise.Research suggests that hydrotherapy reduces injury by stimulating circulation and reducing swelling. It is also particularly useful in taking the weight off of a sore joint and providing resistance by utilising the physical properties of water. Hydrotherapy is often confused with aqua aerobics, which is generally a strenuous exercise. Quite to the contrary, hydrotherapy focuses on slow and controlled movements that lead to relaxation. At the same time, pushing against the water helps improve muscle strength. Studies have shown that hydrotherapy can improve general fitness in those with arthritis.
      - link "Let's talk" [ref=f22e75] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f22e80]:
      - heading "Start Hydrotherapy" [level=2] [ref=f22e81]
      - generic [ref=f22e82]: Our hydrotherapy sessions can be tailored to your individual needs. You can begin slowly and gradually build up your strength and flexibility as you increase resistance. If you can’t swim, don’t worry. Our staff will always be present to assist you and help you exercise in the right depth for you. Call us today to see if hydrotherapy is right for you.
      - link "Call us today" [ref=f22e84] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
