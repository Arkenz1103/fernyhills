    - generic [ref=f19e131]:
      - heading "How we can help" [level=2] [ref=f19e132]
      - generic [ref=f19e134]:
        - paragraph [ref=f19e135]: A physiotherapist can get you moving again and that’s where we come in. We focus on strengthening your body to support your joints, getting them moving again and improving your overall ability to move. Our goal is to get you back to your daily activities without the suffering.
        - paragraph [ref=f19e136]: In order to get you to this point, we come up with an individualised exercise plan for you to increase your strength and flexibility. Our hope is that you will come away from your visits with an increased knowledge of how to perform exercises independently so you can do them even when we aren’t around.
        - paragraph [ref=f19e137]: In addition to these exercises, we may recommend using devices to assist you such as walkers, braces, orthotics, splints, and other such materials for easing your pain and making your day easier.
      - link "Let's talk" [ref=f19e138] [cursor=pointer]:
        - /url: /contact-us/
