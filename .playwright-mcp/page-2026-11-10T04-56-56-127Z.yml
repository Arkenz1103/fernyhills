  - main [ref=f19e27]:
    - generic [ref=f19e30]:
      - heading "Our friendly staff is here for you" [level=1] [ref=f19e31]
      - paragraph [ref=f19e33]: Arthritis Treatment Available in Ferny Hills
    - generic [ref=f19e39]:
      - heading "Treatment to relieve your suffering" [level=2] [ref=f19e40]
      - generic [ref=f19e42]:
        - paragraph [ref=f19e43]: Do you struggle to climb the stairs in your own home because your joints are screaming at you in protest? You aren’t alone – there are over 100 different kinds of arthritis, and it afflicts all age groups. Commonly, it is accompanied by pain, swelling, stiffness and decreased range of motion in the joints. Worst of all, it can cause permanent changes in your joints.
        - paragraph [ref=f19e44]: We want to put an end to the pain causing the struggle in your every-day tasks.
      - link "Call today" [ref=f19e45] [cursor=pointer]:
        - /url: tel:0733515177
