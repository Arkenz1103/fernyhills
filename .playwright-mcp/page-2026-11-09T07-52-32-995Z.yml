        - generic [ref=f3e218]:
          - paragraph [ref=f3e219]: About us
          - heading "The best physio clinic in Ferny Hills" [level=2] [ref=f3e220]
          - paragraph [ref=f3e221]: At Ferny Hills Physiotherapy Centre, we have gained an outstanding reputation as the best physio clinic in Ferny Hill. This is because we only use state-of-the-art equipment and have expert physiotherapists.
          - paragraph [ref=f3e222]: At our centre, we work with you to help you understand your condition or injury. Together, we will identify your therapy needs, assess your pain and develop a treatment plan with you to restore full function to your body. Additionally, we will provide you with tools, professional advice and a supplemental plan to help you prevent further problems.
          - paragraph [ref=f3e223]: Our goal is to teach you how to carry out your treatment in the future to maintain your overall wellness.
    - region [ref=f3e224]:
      - generic [ref=f3e225]:
        - generic [ref=f3e226]:
          - paragraph [ref=f3e227]: Our team
          - heading "Our specialists" [level=2] [ref=f3e228]
          - paragraph [ref=f3e229]: Our long-established practice was purchased by Marcus Hood, a seasoned physiotherapist who built this clinic through his expertise in rehabilitation and private practice during his stay in America. He has added a highly qualified team of senior physiotherapists with 80 years of combined experience who share his passion for healing.
          - paragraph [ref=f3e230]: This team is trained to treat a wide range of conditions in the Ferny Hill community and surrounding area. During the course of your treatment, you will work with one of these specialists to develop a personalised plan for you whilst we assist you in working toward your goal.
          - paragraph [ref=f3e231]: Once your initial complaint is treated and pain is manageable again, we provide the tools necessary to maintain your healthy condition and prevent future issues.
          - link "Book with a specialist" [ref=f3e232] [cursor=pointer]:
            - /url: http://bookings.ppmp.com.au/?ver=9IEGaMIPbqIHiUJMOUSEAx5lOeMhUUqjm0PlgMYSgK7xxBijrsm7tArnQ2AJFYbBbn6W1cVC3UkOlIJpK0zNV/8SQ==
