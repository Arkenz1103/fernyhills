  - main [ref=f113e27]:
    - generic [ref=f113e30]:
      - heading "Our specialists want to help relieve your back pain" [level=1] [ref=f113e31]
      - paragraph [ref=f113e33]: Back Pain Management at Ferny Hills Physiotherapy Centre
    - generic [ref=f113e39]:
      - heading "Listen to this" [level=2] [ref=f113e40]
      - paragraph [ref=f113e43]: Statistics indicate that 90% of people will experience back pain at least once in their life. Back pain can travel to other areas of the body and become progressively worse. Physiotherapy for back pain is a less risky alternative to surgery and is often equally as effective without the undesirable complications that accompany surgery.
      - link "Learn more" [ref=f113e44] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=f113e81]:
      - generic [ref=f113e82]: Prevent injuries
      - heading "Treat the pain source" [level=2] [ref=f113e83]
      - generic [ref=f113e85]:
        - paragraph [ref=f113e86]: Ferny Hills Physiotherapy will perform an evaluation to determine the cause of your back pain. We will review your health history and ask questions about your symptoms to pinpoint any behaviours that may be contributing factors to your pain. We will decide upon a course of action and treat you with manual therapy, exercises and use of heat or ice to relieve pain.
        - paragraph [ref=f113e87]: We also teach you to maintain proper posture throughout the day and help you learn to listen to your body’s signals that your body mechanics are misaligned. This includes training for proper lifting, sitting, and bending and proper sleeping positions. We can prescribe you the ongoing exercises we see fit for your condition and change them when necessary.
      - link "Let's talk" [ref=f113e88] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=f113e93]:
      - generic [ref=f113e96]:
        - heading "Get started" [level=2] [ref=f113e97]
        - paragraph [ref=f113e98]: See us today to get started with physiotherapy so that you can have a life without back pain.
