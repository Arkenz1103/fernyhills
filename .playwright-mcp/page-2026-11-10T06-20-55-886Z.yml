  - main [ref=f64e27]:
    - generic [ref=f64e30]:
      - heading "Sports Injury Rehabilitation Services in Ferny Hills" [level=1] [ref=f64e31]
      - paragraph [ref=f64e33]: Serving Samford
    - generic [ref=f64e39]:
      - heading "Quality treatment" [level=2] [ref=f64e40]
      - paragraph [ref=f64e43]: Sports injuries affect bones, muscles, tissues and cartilage and are detrimental to normal daily activities, not just athletic performance. They can happen to a professional athlete or a father playing ball with his children in the park. If your active lifestyle has been hindered by a sports injury, our physiotherapists have an extensive knowledge of the musculoskeletal system that will get you back to doing what you love.
      - link "Enquire now" [ref=f64e44] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=f64e58]:
      - heading "Prevent injuries" [level=2] [ref=f64e59]
      - generic [ref=f64e61]:
        - paragraph [ref=f64e62]: If you have been injured or you lead an active life where you are prone to injury, we recommend seeing a physiotherapist sooner rather than later. Waiting to be rehabilitated may end up worsening your injury. Sports injuries require supervision and time to heal safely.
        - paragraph [ref=f64e63]: Our staff can help you heal quickly, improve athletic performance and even prevent injuries before they even happen through a custom plan balancing stretching, exercise and rest.
      - link "Let's talk" [ref=f64e64] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=f64e69]:
      - generic [ref=f64e72]:
        - heading "Start healing" [level=2] [ref=f64e73]
        - paragraph [ref=f64e74]: Every injury is unique and everyone heals differently. Ferny Hills specialists will identify the cause for your specific injury, create a program and help you prevent injury in the future. But don’t wait until you’re injured. Call us today so we can help optimise your sports performance and help you play safely.
      - generic [ref=f64e75]:
        - link "Start healing today" [ref=f64e76] [cursor=pointer]:
