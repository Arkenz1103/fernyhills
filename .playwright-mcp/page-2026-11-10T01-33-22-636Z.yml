  - main [ref=f20e42]:
    - generic [ref=f20e45]:
      - heading "Sports Injury Rehabilitation Services in Ferny Hills" [level=2] [ref=f20e46]
      - generic [ref=f20e47]: Serving Samford
    - generic [ref=f20e51]:
      - heading "Quality treatment" [level=2] [ref=f20e52]
      - generic [ref=f20e53]: Sports injuries affect bones, muscles, tissues and cartilage and are detrimental to normal daily activities, not just athletic performance. They can happen to a professional athlete or a father playing ball with his children in the park. If your active lifestyle has been hindered by a sports injury, our physiotherapists have an extensive knowledge of the musculoskeletal system that will get you back to doing what you love.
      - button "Enquire now" [ref=f20e55] [cursor=pointer]
    - generic [ref=f20e60]:
      - heading "We were voted the best physio clinic around" [level=2] [ref=f20e61]
      - button "Contact us" [ref=f20e63] [cursor=pointer]
    - generic [ref=f20e70]:
      - heading "Prevent injuries" [level=2] [ref=f20e71]
      - generic [ref=f20e72]: If you have been injured or you lead an active life where you are prone to injury, we recommend seeing a physiotherapist sooner rather than later. Waiting to be rehabilitated may end up worsening your injury. Sports injuries require supervision and time to heal safely. Our staff can help you heal quickly, improve athletic performance and even prevent injuries before they even happen through a custom plan balancing stretching, exercise and rest.
      - button "Let's talk" [ref=f20e74] [cursor=pointer]
    - generic [ref=f20e79]:
      - heading "Start healing" [level=2] [ref=f20e80]
      - generic [ref=f20e81]: Every injury is unique and everyone heals differently. Ferny Hills specialists will identify the cause for your specific injury, create a program and help you prevent injury in the future. But don’t wait until you’re injured – call us today so we can help optimise your sports performance and help you play safely.
      - button "Start healing today" [ref=f20e83] [cursor=pointer]
