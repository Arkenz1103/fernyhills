  - main [ref=f21e42]:
    - generic [ref=f21e45]:
      - heading "Our specialists want to help relieve your back pain" [level=2] [ref=f21e46]
      - generic [ref=f21e47]: Back Pain Management at Ferny Hills Physiotherapy Centre
    - generic [ref=f21e51]:
      - heading "Listen to this" [level=2] [ref=f21e52]
      - generic [ref=f21e53]: Statistics indicate that 90% of people will experience back pain at least once in their life. Back pain can travel to other areas of the body and become progressively worse. Physiotherapy for back pain is a less risky alternative to surgery and is often equally as effective without the undesirable complications that accompany surgery.
      - link "Learn more" [ref=f21e55] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f21e61]:
      - heading "We have 80 years of combined experience" [level=2] [ref=f21e62]
      - link "Contact us" [ref=f21e64] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f21e71]:
      - heading "Prevent injuriesTreat the pain source" [level=2] [ref=f21e72]
      - generic [ref=f21e73]: Ferny Hills Physiotherapy will perform an evaluation to determine the cause of your back pain. We will review your health history and ask questions about your symptoms to pinpoint any behaviours that may be contributing factors to your pain. We will decide upon a course of action and treat you with manual therapy, exercises and use of heat or ice to relieve pain. We also teach you to maintain proper posture throughout the day and help you learn to listen to your body’s signals that your body mechanics are misaligned. This includes training for proper lifting, sitting, and bending and proper sleeping positions. We can prescribe you the long-term exercises we see fit for your condition and change them when necessary.
      - link "Let's talk" [ref=f21e75] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
    - generic [ref=f21e80]:
      - heading "Get started" [level=2] [ref=f21e81]
      - generic [ref=f21e82]: See us today to get started with physiotherapy so that you can have a life without back pain.
      - link "Call us" [ref=f21e84] [cursor=pointer]:
        - /url: https://fernyhillsphysiotherapy.com.au/contact-us/
