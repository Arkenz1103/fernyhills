        - generic:
          - heading "Compress images" [level=3]
          - paragraph: Modern formats, right-sized. The single biggest saving on most pages.
        - generic:
          - heading "Ship less JavaScript" [level=3]
          - paragraph: Every kilobyte is shipped, parsed and run — on the reader's battery.
        - generic:
