    - generic [ref=e120]:
      - heading "Our Personalised Treatment approach" [level=2] [ref=e121]
      - generic [ref=e122]:
        - paragraph [ref=e123]: Our treatment plan for you begins with a comprehensive assessment and physical exam to diagnose your condition. We then communicate with you and other health professionals to collaborate on a treatment and recovery plan to get you back on your feet. When we have determined your health goal, we will begin treatment which involves hands-on mobilisation and soft tissue techniques.
        - paragraph [ref=e124]: Once your initial complaint is treated, we will teach you to manage your pain and aid your recovery.
        - paragraph [ref=e125]: All of our treatment techniques are based on scientific research and clinical experience. We are always adapting to new treatment methods and advances in technology so you receive the most up-to-date care.
      - link "Let's talk" [ref=e126] [cursor=pointer]:
        - /url: /contact-us/
    - generic [ref=e130]:
      - heading "We use state-of-the-art equipment for your care" [level=2] [ref=e132]
