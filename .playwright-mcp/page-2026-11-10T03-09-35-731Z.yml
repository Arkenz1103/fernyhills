    - generic [ref=e141]:
      - heading "Specialised equipment" [level=2] [ref=e142]
      - generic [ref=e143]:
        - paragraph [ref=e144]: At Ferny Hills Physiotherapy, we use the best possible diagnostic and treatment equipment. This includes our Vibro Trainer for advanced muscle training and our Gaitscan™ biomechanical footprint scanner to identify abnormalities and prescribe custom orthotics. We also supply equipment that aids in rehabilitation and injury prevention such as supportive braces, therapeutic sandals and contoured pillows.
        - paragraph [ref=e145]: Our staff is happy to help you obtain these materials to promote your speedy recovery.
      - link "Let's talk" [ref=e146] [cursor=pointer]:
        - /url: /contact-us/
